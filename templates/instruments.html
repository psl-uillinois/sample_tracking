<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Samples</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/bootstrap-table.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/extensions/filter-control/bootstrap-table-filter-control.min.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/bootstrap-table.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/extensions/filter-control/bootstrap-table-filter-control.min.js"></script>
	<style>
	tbody {
		cursor: pointer;
	}
	body {
		padding-left: 5vw;
		padding-right: 5vw;
		padding-top: 5vh;
		padding-bottom: 5vh;
	}
	</style>
</head>
<body>
<!--<div class="d-flex flex-column min-vh-100 justify-content-center align-items-center">-->
	<p>
		<a href="/samples"><button class="btn btn-secondary">Back to overview</button></a>
		<div class="form-check"><input class="form-check-input" type="checkbox" value="" id="separateTabCheck" /><label class="form-check-label" for="separateTabCheck">Open samples in separate tabs</label></div>
		<div class="form-check"><input class="form-check-input" type="checkbox" value="" id="filterCheck" onchange="UpdateFilter(event)"/><label class="form-check-label" for="filterCheck">Enable filtering by column</label></div>
	</p>

	<div class="table-responsive">
		<table id="table" data-escape="true" data-toggle="table" data-search="true" data-show-refresh="true" data-show-columns="true" data-pagination="true" data-page-list="[10, 25, 50, 100, all]" data-page-size="All" data-sortable="true" data-filter-control="true" data-filter-control-visible="false" data-url="/samples/instruments.json">
		<thead>
			<tr>
				<th data-field="SampleName" data-sortable="true" data-filter-control="input">Sample</th>
				<th data-field="ProcessName" data-sortable="true" data-filter-control="input">Process</th>
				<th data-field="User" data-formatter="FormatUsers" data-filter-control="input">User</th>
			</tr>
		</thead>
		</table>
	</div>

	<script>
	$('#table').on('click-row.bs.table', function (e, row, element, field) {
		if (document.getElementById('separateTabCheck').checked) {
			window.open(window.location.origin + "/samples/show?uid=" + row["UID"], '_blank').focus();
		} else {
			window.location = window.location.origin + "/samples/show?uid=" + row["UID"];
		}
	});
	function UpdateFilter(e) {
		$("#table").bootstrapTable("toggleFilterControl");
	}
	function FormatUsers(value, row, idx) {
		if (value) {
			var username = value.split("&")[0].trim().split(" ");
			var initials = username[0][0] + username[username.length-1][0];
			if (value.endsWith(" (planned)")) {
				return initials + " (planned)";
			} else {
				return initials;
			}
		}
		return '';
	}
	</script>
<!--</div>-->
	</body>
</html>
