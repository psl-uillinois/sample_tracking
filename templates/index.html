<head>
	<meta charset="utf-8">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/bootstrap-table.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/extensions/filter-control/bootstrap-table-filter-control.min.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/bootstrap-table.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/extensions/filter-control/bootstrap-table-filter-control.min.js"></script>
	<script src="/assets/bootstrap-table-cookie.js"></script>
	<style>
	body {
		padding-left: 5vw;
		padding-right: 5vw;
		padding-top: 5vh;
		padding-bottom: 5vh;
	}
	</style>
</head>
<body>
<!--<div class="d-flex flex-column min-vh-100 justify-content-center align-items-center">-->
	<p>
		<button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#addSampleModal">
		Add sample
		</button>
		<a href="/samples/process"><button class="btn btn-primary" type="button">
		Edit processing templates
		</button></a>
		<a href="/samples/todo"><button class="btn btn-primary" type="button">
		View todo list
		</button></a>
		<button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#downloadAllModal">
		Export all as CSV
		</button>
		<!--<a href="/samples/instruments"><button class="btn btn-primary" type="button">
		View in-use instruments
		</button></a>-->
		<!--<div class="form-check"><input class="form-check-input" type="checkbox" value="" id="separateTabCheck" /><label class="form-check-label" for="separateTabCheck">Open samples in separate tabs</label></div>-->
		<!--<div class="form-check"><input class="form-check-input" type="checkbox" value="" id="filterCheck" onchange="UpdateFilter(event)"/><label class="form-check-label" for="filterCheck">Enable filtering by column</label></div>-->
	</p>
	<div class="modal fade" id="addSampleModal" tabindex="-1" aria-labelledby="addSampleLabel" aria-hidden="true">
		<div class="modal-dialog">
		<div class="modal-content">
		  <div class="modal-header">
			<h1 class="modal-title fs-5" id="addSampleLabel">Add sample</h1>
			<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		  </div>
	<form action="/samples/add" method="post">
		  <div class="modal-body">

		<div class="form-group">
		<label for="project">Project</label>
		<select class="form-select" id="project" name="project" oninput="ChangeProject()">
		<option disabled selected value> -- select a project -- </option>
		{% for project in all_projects %}
		<option value="{{ project }}">{{ project }}</option>
		{% endfor %}
		<option value="other">Other</option>
		</select>
		<input type="text" class="form-control" id="project_secondary" name="project_secondary" style="display:none;" oninput="UpdateSampleID()" disabled>
		<script>
		var sample_id_changed_by_user = false;
		function ChangeProject() {
			var is_other = (document.getElementById("project").value == "other");
			document.getElementById("project_secondary").style.display = is_other ? "block" : "none";
			document.getElementById("project_secondary").disabled = !is_other;
			UpdateSampleID();
		}
		function UpdateSampleID() {
			if (!sample_id_changed_by_user) {
				var httpRequest = new XMLHttpRequest();
				httpRequest.onreadystatechange = function() {
					if (httpRequest.readyState == 4 && httpRequest.status == 200) {
						if (!sample_id_changed_by_user) {
							document.getElementById("id").value = httpRequest.responseText;
						}
					}
				}
				var project = document.getElementById("project").value;
				if (project == 'other') {
					project = document.getElementById("project_secondary").value;
				}
				httpRequest.open("GET", '/samples/get_next_sample?project=' + encodeURIComponent(project), true);
				httpRequest.send(null);
			}
		}
		function SampleIDChanged() {
			sample_id_changed_by_user = (document.getElementById("id").value != '');
		}
		</script>
		</div>
		<div class="form-group">
		<label for="id">ID</label>
		<input type="text" class="form-control" id="id" name="id" oninput="SampleIDChanged()">
		</div>
		<div class="form-group">
		<label for="location">Location</label>
		<select class="form-select" id="location" name="location" oninput="ChangeLocation()">
		<option disabled selected value> -- select a location -- </option>
		{% for location in all_locations %}
		<option value="{{ location }}">{{ location }}</option>
		{% endfor %}
		<option value="other">Other</option>
		</select>
		<input type="text" class="form-control" id="location_secondary" name="location_secondary" style="display:none;" disabled>
		<script>
		function ChangeLocation() {
			var is_other = (document.getElementById("location").value == "other");
			document.getElementById("location_secondary").style.display = is_other ? "block" : "none";
			document.getElementById("location_secondary").disabled = !is_other;
		}
		</script>
		</div>
		<div class="form-group">
		<label for="description">Description</label>
		<input type="text" class="form-control" id="description" name="description">
		</div>
		<div class="form-group">
		<label for="template">Clone sample (leave blank for none)</label>
		<input type="text" class="form-control" id="template" name="template">
		</div>
		<!--<div class="form-group">
		<label for="filmthickness">Film Thickness (um)</label>
		<input type="number" class="form-control" id="filmthickness" name="filmthickness">
		</div>
		<div class="form-group">
		<label for="quality">Quality</label>
		<select class="form-select" aria-label="Default select example" id="quality" name="quality">
		  <option selected>Select quality</option>
		  <option value="0">Low</option>
		  <option value="1">Medium</option>
		  <option value="2">High</option>
		</select>
		</div>-->

		  </div>
		  <div class="modal-footer">
			<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
			<button type="submit" class="btn btn-primary">Submit</button>
		  </div>
	</form>
		</div>
		</div>
	</div>
	
	<div class="modal fade" id="downloadAllModal" tabindex="-1" aria-labelledby="downloadAllModal" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header">
				<h1 class="modal-title fs-5" id="downloadAllLabel">Export all samples</h1>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			  </div>
				<div class="modal-body">
					<p id="deleteSampleInfo">Are you sure you want to download the entire database as CSVs? This action may take several minutes to complete.</p>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<button type="submit" class="btn btn-danger" data-bs-dismiss="modal" onclick="DownloadAll()">Confirm</button>
					<script>
					async function DownloadAll() {
						$.getJSON("/samples/samples.json", function(data) {
							data.forEach((datum, i) => {
								setTimeout(() => {
									var link = document.createElement("a");
									link.href = "/samples/steps.csv?uid=" + datum["UID"];
									link.download = datum["SampleName"] + ".csv";
									link.click();
								}, i * 500);
							});
						})
					}
					</script>
				</div>
			</div>
		</div>
	</div>

	<div class="table-responsive">
		<table id="table" data-toggle="table" data-search="true" data-show-refresh="true" data-show-columns="true" data-pagination="true" data-page-list="[10, 25, 50, 100, all]" data-page-size="All" data-sortable="true" data-filter-control="true" data-filter-control-visible="true" data-sort-name="LastUpdate" data-sort-order="desc" data-url="/samples/samples.json">
		<thead>
			<tr>
				<th data-field="SampleName" data-sortable="true" data-visible="false">Sample Name</th>
				<th data-field="Project" data-sortable="true" data-filter-control="select">Project</th>
				<th data-field="ID" data-sortable="true" data-sorter="IDSorter" data-filter-control="input">ID</th>
				<th data-field="Location" data-sortable="true" data-filter-control="select">Location</th>
				<th data-field="PriorName" data-sortable="true" data-visible="false">Previous name</th>
				<th data-field="Description" data-sortable="true" data-filter-control="input">Description</th>
				<!--<th data-field="FilmThickness" data-sortable="true">Thickness (um)</th>
				<th data-field="Quality" data-sortable="true">Quality</th>-->
				<th data-field="Creation" data-sortable="true" data-filter-control="input" data-visible="false">Creation</th>
				<!--<th data-field="Quality" data-sortable="true" data-filter-control="select" data-visible="false">Quality</th>
				<th data-field="CurrentDensity" data-sortable="true" data-filter-control="select" data-visible="false">Current Density (mA/cm^2)</th>
				<th data-field="Transferred" data-sortable="true" data-filter-control="select" data-visible="false">Transferred</th>
				<th data-field="Thickness" data-sortable="true" data-filter-control="select" data-visible="false">Thickness (um)</th>
				<th data-field="PorousFilm" data-sortable="true" data-filter-control="select" data-visible="false">Porous Film</th>
				<th data-field="FilmDiameter" data-sortable="true" data-filter-control="select" data-visible="false">Film Diameter (in)</th>
				<th data-field="Oxidized" data-sortable="true" data-filter-control="select" data-visible="false">Oxidized</th>
				<th data-field="OxidationPlanned" data-sortable="true" data-filter-control="select" data-visible="false">Oxidation Planned</th>
				<th data-field="Printed" data-sortable="true" data-filter-control="select" data-visible="false">Printed</th>
				<th data-field="PrintPlanned" data-sortable="true" data-filter-control="select" data-visible="false">Print Planned</th>-->
				<th data-field="LastUpdate" data-sortable="true" data-filter-control="input">Last update</th>
				<th data-field="UID" data-formatter="ViewButton">View</th>
			</tr>
		</thead>
		</table>
		</div>
	</div>

	<script>
	/*$('#table').on('click-row.bs.table', function (e, row, element, field) {
		if (document.getElementById('separateTabCheck').checked) {
			window.open(window.location.origin + "/samples/show?uid=" + row["UID"], '_blank').focus();
		} else {
			window.location = window.location.origin + "/samples/show?uid=" + row["UID"];
		}
	});*/
	function UpdateFilter(e) {
		$("#table").bootstrapTable("toggleFilterControl");
	}
	function IDSorter(a, b) {
		const aa = a.match(/[0-9]+/);
		const bb = b.match(/[0-9]+/);
		return aa - bb;
	}
	function ViewButton(value, row, idx) {
		return '<a href="'+window.location.origin+"/samples/show?uid="+row["UID"]+'"><button type="button" class="btn btn-primary">View</button></a>';
	}
	</script>
<!--</div>-->
	</body>
</html>
